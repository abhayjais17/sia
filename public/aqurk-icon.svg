      <stop offset="0" stop-color="#8B5CF6"/><stop offset="0.55" stop-color="#5B7CFF"/><stop offset="1" stop-color="#22B8F0"/>
    </linearGradient>
    <linearGradient id="ring" x1="30" y1="330" x2="490" y2="190" gradientUnits="userSpaceOnUse">
