    <path d="M322 186C256 186 196 242 196 312c0 68 56 126 126 126 26 0 50-8 70-20 20 20 44 30 70 34 -14 -18 -22 -36 -26 -56 18-22 28-50 28-84 0-70-60-126-136-126Z" fill="url(#bub)" transform="translate(-6 -10) scale(1)"/>
